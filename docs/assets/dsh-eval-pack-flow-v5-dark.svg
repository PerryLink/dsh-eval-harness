<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="dsh-eval-pack structure: a pack gate (eval.pack_lint) checks pack.json, then the two documents — expected from cases and actual from run.json — are canonicalised on opposite sides of one comparison gutter and compared byte for byte, then eval.summary and eval.pass_at_k produce the readouts">
